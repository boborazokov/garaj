name: my_auto
description: "A new Flutter project."

version: 1.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.0.0
  flutter_svg: ^2.2.0

  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.3.0
  flutter_localizations:
    sdk: flutter
  bottom_picker: ^3.2.1
  carousel_slider: ^5.1.1
  lucide_icons_flutter: ^3.1.15
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.2.1
  graphql_flutter: ^5.2.0
  shared_preferences: ^2.5.3
  multi_image_picker_view: ^3.0.0
  awesome_select: ^6.0.0
  provider: ^6.1.5
  flutter_secure_storage: ^9.2.4
  pinput: ^5.0.1
  sms_autofill: ^2.4.1
  file_picker: ^10.3.1
  http_parser: ^4.1.2
  mime: ^2.0.0
  share_plus: ^11.1.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.4.0
  flutter_launcher_icons: ^0.14.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_cache_manager: ^3.4.1
  sqflite: ^2.4.2
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  bloc_concurrency: ^0.3.0
  connectivity_plus: ^7.1.1
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  http: ^1.6.0
  photo_view: ^0.15.0

dev_dependencies:
  intl: ^0.20.2
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.11
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
    - assets/svg/

flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
