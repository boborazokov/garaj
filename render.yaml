# Render Blueprint — free NestJS API (autorin-backend)
# Open: https://dashboard.render.com/select-repo?type=blueprint
#
# Free web services sleep after ~15 min idle. Keep awake via:
#   .github/workflows/keep-alive.yml  (secret RENDER_HEALTH_URL)
#   or https://cron-job.org → GET https://<service>.onrender.com/health every 10 min
#
# External free deps (set when Blueprint asks for sync:false):
#   MongoDB Atlas M0  → DATABASE_URL
#   Upstash Redis     → REDIS_HOST + REDIS_PASSWORD (REDIS_TLS=true already set)
# Object storage (required in production — no localhost / default credentials):
#   MINIO_ENDPOINT, MINIO_PORT, MINIO_USE_SSL, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_REGION
# Optional later in Dashboard: MEILI_*, Firebase
#
# SMS: SMS_PROVIDER remains "log" until a real HTTP SMS provider is connected
# (application refuses log transport in production — see known pending integration).

services:
  - type: web
    name: autorin-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: autorin-backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      # Upstash free Redis only supports database index 0
      - key: REDIS_PUBSUB_DB
        value: "0"
      - key: REDIS_QUEUE_DB
        value: "0"
      - key: REDIS_RATELIMIT_DB
        value: "0"
      - key: REDIS_CACHE_DB
        value: "0"
      # Pending real SMS provider integration — do not invent tokens/URLs here.
      - key: SMS_PROVIDER
        value: log
      # Browser/admin origins only (no localhost). Native clients send no Origin.
      - key: ALLOWED_ORIGINS
        value: https://autorin-web-boborazokovs-projects.vercel.app,https://autorin-web-alpha.vercel.app,https://autorin-backend.onrender.com
      # Render terminates HTTPS at the public edge for *.onrender.com
      - key: ENABLE_HSTS
        value: "true"
      # Never set GRAPHQL_INTROSPECTION in production — code ignores it anyway.
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        sync: false
      - key: MINIO_USE_SSL
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_REGION
        sync: false
